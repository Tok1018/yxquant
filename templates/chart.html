// 切割数组，把数组中的日期和数据分离，返回数组中的日期和数据
function splitData(rawData) {
    var categoryData = [];
    var values = [];
    
    for (var i = 0; i < rawData.length; i++) {
        //splice 返回每组数组中被删除的第一项，即返回数组中被删除的日期 
        //alert(rawData[i].splice(0, 1)[0]);
        //categoryData 日期 把返回的日期放到categoryData[]数组中
        categoryData.push(rawData[i].splice(0, 1)[0]);
        //alert(categoryData);

        //数据数组，即数组中除日期外的数据
        // alert(rawData[i]);
        values.push(rawData[i])
    }
    return {
        categoryData: categoryData, //数组中的日期 x轴对应的日期
        values: values  //数组中的数据 y轴对应的数据
    };
}

//计算MA平均线，N日移动平均线=N日收盘价之和/N dayCount要计算的天数(5,10,20,30)
function calculateMA(dayCount, values) {
    var result = [];
    for (var i = 0, len = values.length; i < len; i++) {
        if (i < dayCount) {
            result.push('-');
            //alert(result);
            continue; //结束单次循环，即不输出本次结果
        }
        var sum = 0;
        for (var j = 0; j < dayCount; j++) {
            //收盘价总和
            sum += values[i - j][1];
            //alert(sum);
        }
        result.push(sum / dayCount);
        // alert(result);
    }
    return result;
}

// 渲染K线图 - 直接按照网页示例
function renderKlineChart(data) {
    const klineChart = echarts.init(document.getElementById('klineChart'));
    
    // 直接使用网页示例的数据格式
    const klineData = data.kline_data.map((item, index) => [
        data.dates[index], item[0], item[1], item[2], item[3]
    ]);
    
    const option = {
        xAxis: {
            type: 'category',
            data: data.dates,
            scale: true
        },
        yAxis: {
            scale: true,
            splitArea: {
                show: true
            }
        },
        dataZoom: [{
            type: 'slider',
            bottom: '-2%'
        }],
        series: [{
            name: 'K线',
            type: 'candlestick',
            data: klineData
        }]
    };
    
    klineChart.setOption(option);
}

// 更新图表标题
function updateChartTitle() {
    const titleMap = {
        'kline': 'K线图 + 成交量',
        'line': '价格走势图',
        'technical': '技术指标图'
    };
    
    document.getElementById('chartTitle').textContent = titleMap[currentChartType] || '股票图表';
}

// 更新股票信息
async function updateStockInfo() {
    try {
        const response = await fetch(`/api/stock/${currentSymbol}`);
        if (response.ok) {
            const data = await response.json();
            const stock = data.stock;
            
            if (stock) {
                document.getElementById('currentPrice').textContent = 
                    stock.current_price ? `¥${stock.current_price.toFixed(2)}` : '-';
                
                const changePercent = stock.change_percent || 0;
                const changeElement = document.getElementById('changePercent');
                changeElement.textContent = `${changePercent > 0 ? '+' : ''}${changePercent.toFixed(2)}%`;
                changeElement.className = `text-${changePercent >= 0 ? 'success' : 'danger'}`;
                
                document.getElementById('volume').textContent = 
                    stock.volume ? formatNumber(stock.volume) : '-';
                
                document.getElementById('marketCap').textContent = 
                    stock.market_cap ? formatNumber(stock.market_cap) : '-';
            }
        }
    } catch (error) {
        console.error('更新股票信息失败:', error);
    }
}

// 格式化数字
function formatNumber(num) {
    if (num >= 1e8) {
        return (num / 1e8).toFixed(2) + '亿';
    } else if (num >= 1e4) {
        return (num / 1e4).toFixed(2) + '万';
    } else {
        return num.toLocaleString();
    }
}
