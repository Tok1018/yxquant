<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>策略回测 - 量化交易AI系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/css/style.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="/">量化交易AI系统</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/">首页</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/watchlist">自选股</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/strategies">策略管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/backtest">回测</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/analysis">AI分析</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/data">数据管理</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/monitor">系统监控</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h2>策略回测</h2>
                <p class="text-muted">测试策略的历史表现</p>
            </div>
        </div>

        <div class="row mt-4">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">回测配置</h5>
                    </div>
                    <div class="card-body">
                        <form id="backtestForm">
                            <div class="mb-3">
                                <label for="strategy" class="form-label">选择策略</label>
                                <select class="form-select" id="strategy" name="strategy_name" required>
                                    <option value="">请选择策略</option>
                                    {% for strategy in strategies %}
                                    <option value="{{ strategy.name }}">{{ strategy.display_name }}</option>
                                    {% endfor %}
                                </select>
                            </div>
                            
                            <div class="mb-3">
                                <label for="symbols" class="form-label">选择股票</label>
                                <select class="form-select" id="symbols" name="symbols" multiple required>
                                    {% if not watchlist.empty %}
                                    {% for index, stock in watchlist.iterrows() %}
                                    <option value="{{ stock.symbol }}">{{ stock.symbol }} - {{ stock['name'] }}</option>
                                    {% endfor %}
                                    {% endif %}
                                </select>
                                <div class="form-text">按住Ctrl键多选</div>
                            </div>
                            
                            <div class="row">
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="start_date" class="form-label">开始日期</label>
                                        <input type="date" class="form-control" id="start_date" name="start_date" required>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="mb-3">
                                        <label for="end_date" class="form-label">结束日期</label>
                                        <input type="date" class="form-control" id="end_date" name="end_date" required>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="initial_capital" class="form-label">初始资金</label>
                                <input type="number" class="form-control" id="initial_capital" name="initial_capital" value="1000000" min="10000" step="10000">
                            </div>
                            
                            <button type="submit" class="btn btn-primary">开始回测</button>
                        </form>
                    </div>
                </div>
            </div>
            
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="mb-0">回测结果</h5>
                    </div>
                    <div class="card-body">
                        <div id="backtestResults" style="display: none;">
                            <div class="row">
                                <div class="col-6">
                                    <div class="text-center">
                                        <h6>总收益率</h6>
                                        <h4 id="totalReturn" class="text-primary">-</h4>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="text-center">
                                        <h6>年化收益率</h6>
                                        <h4 id="annualReturn" class="text-primary">-</h4>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row mt-3">
                                <div class="col-6">
                                    <div class="text-center">
                                        <h6>夏普比率</h6>
                                        <h4 id="sharpeRatio" class="text-success">-</h4>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="text-center">
                                        <h6>最大回撤</h6>
                                        <h4 id="maxDrawdown" class="text-danger">-</h4>
                                    </div>
                                </div>
                            </div>
                            
                            <div class="row mt-3">
                                <div class="col-6">
                                    <div class="text-center">
                                        <h6>胜率</h6>
                                        <h4 id="winRate" class="text-info">-</h4>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="text-center">
                                        <h6>交易次数</h6>
                                        <h4 id="tradesCount" class="text-secondary">-</h4>
                                    </div>
                                </div>
                            </div>
                        </div>
                        
                        <div id="noResults" class="text-center text-muted">
                            <p>请配置回测参数并开始回测</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/main.js"></script>
    <script>
        // 设置默认日期
        const today = new Date();
        const oneYearAgo = new Date(today.getFullYear() - 1, today.getMonth(), today.getDate());
        
        document.getElementById('end_date').value = today.toISOString().split('T')[0];
        document.getElementById('start_date').value = oneYearAgo.toISOString().split('T')[0];

        document.getElementById('backtestForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(this);
            const data = {
                strategy_name: formData.get('strategy_name'),
                symbols: Array.from(document.getElementById('symbols').selectedOptions).map(option => option.value),
                start_date: formData.get('start_date'),
                end_date: formData.get('end_date'),
                initial_capital: parseFloat(formData.get('initial_capital'))
            };
            
            // 显示加载状态
            const submitBtn = this.querySelector('button[type="submit"]');
            const originalText = submitBtn.textContent;
            submitBtn.textContent = '回测中...';
            submitBtn.disabled = true;
            
            fetch('/api/backtest/run', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    displayResults(data.results);
                } else {
                    alert('回测失败: ' + data.message);
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert('回测失败');
            })
            .finally(() => {
                submitBtn.textContent = originalText;
                submitBtn.disabled = false;
            });
        });
        
        function displayResults(results) {
            document.getElementById('backtestResults').style.display = 'block';
            document.getElementById('noResults').style.display = 'none';
            
            document.getElementById('totalReturn').textContent = (results.total_return * 100).toFixed(2) + '%';
            document.getElementById('annualReturn').textContent = (results.annual_return * 100).toFixed(2) + '%';
            document.getElementById('sharpeRatio').textContent = results.sharpe_ratio.toFixed(2);
            document.getElementById('maxDrawdown').textContent = (results.max_drawdown * 100).toFixed(2) + '%';
            document.getElementById('winRate').textContent = (results.win_rate * 100).toFixed(2) + '%';
            document.getElementById('tradesCount').textContent = results.trades_count;
        }
    </script>
</body>
</html>
